<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#07090b" />
  <title>Grandstone Formula 2026</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#07090b;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
    #boot{position:fixed;inset:0;display:grid;place-items:center;background:#07090b}.box{text-align:center}
    .box b{display:block;font-size:30px;letter-spacing:.08em}.box span{display:block;margin-top:10px;color:#f2ff48;font-size:12px;letter-spacing:.16em}
    #err{display:none;position:fixed;inset:0;padding:32px;background:#07090b;color:#fff;font:16px/1.55 system-ui}#err h1{color:#f2ff48}
  </style>
</head>
<body>
  <div id="boot"><div class="box"><b>GRANDSTONE</b><span id="status">LOADING V11 TRACK UPDATE</span></div></div>
  <div id="err"><h1>GRANDSTONE LOAD ERROR</h1><p id="errmsg"></p></div>
  <script>
  (async()=>{
    const status=document.getElementById('status');
    try{
      if(typeof DecompressionStream!=='function') throw new Error('Use a current Chrome or Edge browser.');
      const sizes=[5500,5500,5500,5500,5500,5500,5500,3476];
      const files=sizes.map((_,i)=>`./v10.${i}.txt?rev=10`);
      status.textContent='DOWNLOADING BASE GAME';
      const parts=[];
      for(let i=0;i<files.length;i++){
        const r=await fetch(files[i],{cache:'no-store'});
        if(!r.ok) throw new Error(`Base payload part ${i} failed: HTTP ${r.status}`);
        const part=(await r.text()).replace(/\s+/g,'');
        if(part.length!==sizes[i]) throw new Error(`Base payload part ${i} size mismatch: ${part.length} / ${sizes[i]}`);
        parts.push(part);
      }
      const b64=parts.join('');
      if(b64.length!==41976) throw new Error(`Base package size mismatch: ${b64.length} / 41976`);
      const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      let html=await new Response(stream).text();
      status.textContent='APPLYING V11 TRACK & STADIUM PATCH';
      const pr=await fetch('./v11-patch.json?rev=11',{cache:'no-store'});
      if(!pr.ok) throw new Error(`V11 patch failed: HTTP ${pr.status}`);
      const patch=await pr.json();
      if(patch.version!==11||!Array.isArray(patch.replacements)) throw new Error('Invalid V11 patch package.');
      for(let i=0;i<patch.replacements.length;i++){
        const [from,to]=patch.replacements[i],count=html.split(from).length-1;
        if(count!==1) throw new Error(`V11 patch ${i} match count ${count}`);
        html=html.replace(from,to);
      }
      const byteLength=new TextEncoder().encode(html).length;
      if(byteLength!==97788) throw new Error(`V11 game byte-size mismatch: ${byteLength} / 97788`);
      const required=['Grandstone Formula 2026','SAFETY CAR','FRONT WING CHANGE','COCKPIT','CAR STATUS','SPACE hard brake','createBarrierMesh'];
      for(const term of required){if(!html.includes(term)) throw new Error(`V11 validation failed: missing ${term}`);}
      status.textContent='STARTING V11 RACE ENGINE';
      const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));
      location.replace(url);
    }catch(err){
      document.getElementById('boot').style.display='none';
      document.getElementById('err').style.display='block';
      document.getElementById('errmsg').textContent=String(err&&err.message||err);
    }
  })();
  </script>
</body>
</html>
