<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#07090b" />
  <title>Grandstone Formula 2026</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#07090b;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
    #boot{position:fixed;inset:0;display:grid;place-items:center;background:#07090b;z-index:10}
    .bootbox{text-align:center}.bootbox b{display:block;font-size:28px;letter-spacing:.08em}.bootbox span{display:block;margin-top:10px;color:#f2ff48;font-size:12px;letter-spacing:.18em}
    #err{display:none;position:fixed;inset:0;padding:32px;background:#07090b;color:white;z-index:99;font:16px/1.5 system-ui}
    #err h1{color:#f2ff48}
  </style>
</head>
<body>
  <div id="boot"><div class="bootbox"><b>GRANDSTONE</b><span id="bootmsg">LOADING FORMULA 2026</span></div></div>
  <div id="err"><h1>GRANDSTONE LOAD ERROR</h1><p id="errmsg"></p></div>
  <script>
  (async()=>{
    const bootmsg=document.getElementById('bootmsg');
    try{
      const files=[0,1,2,3,4,5].map(i=>`./payload.${i}.txt?rev=6`);
      bootmsg.textContent='DOWNLOADING GAME PACKAGE';
      const parts=await Promise.all(files.map(async(file,i)=>{
        const r=await fetch(file,{cache:'no-store'});
        if(!r.ok) throw new Error(`Game payload part ${i} failed: HTTP ${r.status}`);
        return (await r.text()).replace(/\s+/g,'');
      }));
      const b64=parts.join('');
      if(b64.length!==31580) throw new Error(`Game package size mismatch: ${b64.length} / 31580`);
      if(!/^[A-Za-z0-9+/]*={0,2}$/.test(b64)) throw new Error('Game package contains invalid Base64 data.');
      bootmsg.textContent='VERIFYING GAME PACKAGE';
      const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
      if(typeof DecompressionStream!=='function') throw new Error('Use a current Chrome or Edge browser.');
      const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html=await new Response(stream).text();
      const htmlBytes=new TextEncoder().encode(html).length;
      if(htmlBytes!==72066) throw new Error(`Decompressed game byte-size mismatch: ${htmlBytes} / 72066`);
      if(!html.includes('Grandstone Formula 2026')||!html.includes('[hidden]{display:none!important}')) throw new Error('Game package validation failed.');
      bootmsg.textContent='STARTING RACE ENGINE';
      const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));
      location.replace(url);
    }catch(err){
      document.getElementById('boot').style.display='none';
      document.getElementById('err').style.display='block';
      document.getElementById('errmsg').textContent=String(err&&err.message||err);
    }
  })();
  </script>
</body>
</html>
